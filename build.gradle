plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    // Local copies of the jars installed in the Simply NeoForged instance (not committed, see libs/README.md).
    implementation files('libs/thaumaturge-26.1.2-NeoForge-1.1.0.jar')
    runtimeOnly files('libs/curios-neoforge-15.0.0+26.1.2.jar')
    // Fundamentum supplies cord whips and scythe moves.
    compileOnly files('libs/fundamentum-neoforge-1.27.2+26.1.2.jar')
    compileOnly files('libs/jei-26.1.2-common-api-29.47.0.111.jar')
    // -PwithOstentum runs the newest Fundamentum plus Ostentum instead, for its summon charms (the summon mark test).
    if (project.hasProperty('withOstentum')) {
        runtimeOnly files('libs/fundamentum-neoforge-1.27.2+26.1.2.jar', 'libs/ostentum-neoforge-1.9.8+26.1.2.jar')
    } else {
        runtimeOnly files('libs/fundamentum-neoforge-1.27.2+26.1.2.jar')
    }
    runtimeOnly files('libs/lithostitched-1.8.1-neoforge-26.1.jar')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            jvmArgument '-Xmx3G'
            // Development-only automated scythe check: tools/run_client_test.sh (./gradlew runClient -Pautotest=1)
            if (project.hasProperty('autotest')) {
                systemProperty 'arcanavaria.autotest', project.property('autotest').toString()
            }
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'arcanavaria.selftest', 'true'
            if (project.hasProperty('lenstest')) {
                systemProperty 'arcanavaria.lenstest', 'true'
                jvmArgument '-Xmx4G'
            }
            if (project.hasProperty('scythetest')) {
                systemProperty 'arcanavaria.scythetest', 'true'
            }
        }
        configureEach {
            systemProperty 'forge.logging.markers', ''
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            thaumaturge_version_range: thaumaturge_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// LGPL-3.0-or-later: the licence texts and credits ship in the jar's META-INF
tasks.named('jar') {
    from([file('LICENSE'), file('COPYING'), file('CREDITS.md'), file('LICENSE-third-party.md')]) {
        into 'META-INF'
    }
}
